<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meliona crest - a hexagon cut by an X into two triangles and three rhombuses, on a charcoal disc with three fading rings">
  <!-- Geometry: regular hexagon, circumradius 35, split along the two diagonals
       that join opposite side vertices. Pieces never touch: 1.1 gap to the
       keystone rhombus, 5.9 across the X. Rings fade outward. -->
  <circle cx="60" cy="60" r="47.2" fill="none" stroke="#2E2A25" stroke-width="1.8" stroke-opacity="0.85"/>
  <circle cx="60" cy="60" r="51.4" fill="none" stroke="#2E2A25" stroke-width="1.3" stroke-opacity="0.5"/>
  <circle cx="60" cy="60" r="55.6" fill="none" stroke="#2E2A25" stroke-width="0.9" stroke-opacity="0.22"/>
  <circle cx="60" cy="60" r="44" fill="#2E2A25"/>
  <g fill="#B49563">
    <polygon points="60,25 87.358,40.795 60,56.591 32.642,40.795"/>
    <polygon points="60,57.691 64,60 60,62.309 56,60"/>
    <polygon points="60,95 87.358,79.205 60,63.409 32.642,79.205"/>
    <polygon points="54.095,60 29.689,45.909 29.689,74.091"/>
    <polygon points="65.905,60 90.311,45.909 90.311,74.091"/>
  </g>
</svg>
