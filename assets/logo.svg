<svg viewBox="-60 -60 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meliona crest - a hexagon cut by an X into two triangles and three rhombuses, on a charcoal disc with three fading rings">
  <!-- Drawn about the centre (0,0): every left/right and top/bottom pair is the
       same number with the sign flipped. Regular hexagon, circumradius 35, cut
       along the diagonals joining opposite side vertices; pieces never touch
       (1.1 to the keystone, 5.9 across the X). The rings fade outward and
       ripple on hover (static/app.css, main.py). -->
  <circle class="crest-ring" r="47.2" fill="none" stroke="#2E2A25" stroke-width="1.8" stroke-opacity="0.85"/>
  <circle class="crest-ring" r="51.4" fill="none" stroke="#2E2A25" stroke-width="1.3" stroke-opacity="0.5"/>
  <circle class="crest-ring" r="55.6" fill="none" stroke="#2E2A25" stroke-width="0.9" stroke-opacity="0.22"/>
  <circle r="44" fill="#2E2A25"/>
  <g fill="#EDE9E3">
    <polygon points="0,-35 27.358,-19.205 0,-3.409 -27.358,-19.205"/>
    <polygon points="0,-2.309 4,0 0,2.309 -4,0"/>
    <polygon points="0,35 27.358,19.205 0,3.409 -27.358,19.205"/>
    <polygon points="-5.905,0 -30.311,-14.091 -30.311,14.091"/>
    <polygon points="5.905,0 30.311,-14.091 30.311,14.091"/>
  </g>
</svg>
