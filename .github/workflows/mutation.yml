# Break it on purpose, every week (John, 2026-11-10): green checks only mean
# something if they go red when the code is wrong. tools/mutation_check.py
# plants 45 known bugs, one at a time, in a temp copy of the repo and fails if
# any of them leaves every test green. Too slow for every push (~40 minutes),
# so it runs weekly and from the Actions tab (Run workflow).
name: Mutation check

on:
  workflow_dispatch:
  schedule:
    - cron: "43 9 * * 1"

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes; the token stays off disk
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Plant 45 bugs, one at a time - each must turn a test red
        run: python -m tools.mutation_check
