# TEMPORARY (removed in the next commit): runs only tools.live_provenance so its
# output can be read; the full Live audit's log is too long to read from a cloud session.
name: Provenance probe
on:
  push:
    branches: ["claude/nice-goldberg-xqeowv"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q -r requirements.txt
      - run: python -m pip list 2>/dev/null | grep -iE "^(pandas|numpy|yfinance|scipy) " ; python -W ignore -m tools.live_provenance 2>&1 | grep -E "^FAIL|provenance checks" || true
