# Live audit: the engine against REAL Yahoo Finance data, and the deployed site
# in a real browser. GitHub's runners have open internet; the cloud sandboxes
# that build this project do not, so this is where "is it live data?" gets an
# answer instead of an assumption. Run it from the Actions tab (Run workflow),
# or push to a claude/** branch.
name: Live audit

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Deployed app to check in a browser
        default: https://summer-2026-quant-project-risk-engine-blueprint-production.up.railway.app
  push:
    branches: ["claude/**"]
  # Daily on main (2026-11-04 security review): nothing watched the live site
  # between pushes. On main, step 5 also proves Railway serves main's commit.
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: read

jobs:
  live-audit:
    # Pinned, not ubuntu-latest: on 2026-11-04 ubuntu-latest became 26.04, which
    # Playwright 1.56.1 cannot install Chromium on ("does not support chromium on
    # ubuntu26.04-x64"), and every browser step (site, devices, glides, deep scan)
    # failed before it ran. Move both together when Playwright supports 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SITE_URL: ${{ inputs.site_url || 'https://summer-2026-quant-project-risk-engine-blueprint-production.up.railway.app' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false  # nothing here pushes; the token stays off disk
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install -r requirements.txt ruff==0.17.3 bandit==1.9.4 pip-audit==2.10.1
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: 0. Self-check (lint, bandit, engine tests with live checks, narrative) + dependency CVEs
        run: |
          python -m tools.check
          # No CVE is skipped: the 2026-10-20 Pillow exception closed with
          # Streamlit 1.66.1 and Pillow 13 (ME-16). A new exception needs John's
          # call and test_the_dependency_audit_skips_no_cve changed with it.
          python -m pip_audit -r requirements.txt
      - name: 1. Provenance - engine prices vs raw Yahoo API, ^IRX vs the Treasury
        if: always()
        run: |
          set -o pipefail
          python -m tools.live_provenance | tee provenance.log
      - name: 3. Batch audit - every preset on live data, each check cites its source
        if: always()
        run: python -m tests.batch_audit
      - name: 4. Walkthrough on live data - NaN, contradictions, unexplained jargon
        if: always()
        run: python -m tools.demo_check
      - name: 4b. Crisis record on live data - the table the Conviction sentences are read from
        if: always()
        run: python -m src.conviction
      - name: 5. Deployed site in a browser - skeleton, top bar, headline, errors
        if: always()
        env:
          # on main the deployed site must be serving this very commit
          EXPECT_BUILD: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
          # new page features are required of the deployed site only once main is deployed
          DOCK: ${{ github.ref == 'refs/heads/main' && 'required' || 'optional' }}
        run: |
          mkdir -p site-shots
          node tools/site_check.mjs "$SITE_URL" site-shots
      - name: 6. Deployed site - outside-in security probe
        if: always()
        # on main the deployed site is this commit, so its headers are required
        run: python -m tools.security_probe "$SITE_URL" ${{ github.ref == 'refs/heads/main' && '--require-headers' || '' }}

      # This commit's own app, started here on live data - what merging will ship.
      - name: 7. Start this commit's app (launch files installed as in Procfile)
        if: always()
        run: |
          python -m tools.public_files
          nohup streamlit run serve.py --server.port 8501 --server.headless true > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8501/_stcore/health && break; sleep 2; done
      - name: 8. This commit - launch basics (SEO, OG, 404, first paint), security, recruiter walk
        if: always()
        run: |
          mkdir -p site-shots/local walk/local
          SEO=1 node tools/site_check.mjs http://127.0.0.1:8501 site-shots/local
          python -m tools.security_probe http://127.0.0.1:8501 --require-headers
          node tools/recruiter_walk.mjs http://127.0.0.1:8501 walk/local
      - name: 8b. This commit - every phone, tablet and desktop (overlap, sideways, cut-off text, clickable)
        if: always()
        run: |
          mkdir -p site-shots/devices
          node tools/device_check.mjs http://127.0.0.1:8501 site-shots/devices
          # a first visit's click, keys and wheel never paint a gold block (John, 2026-11-06)
          node tools/key_wheel_check.mjs http://127.0.0.1:8501 site-shots/keys
          # the wheel glides over the Risk Topology map too, not the browser's step (John, 2026-11-06)
          node tools/map_wheel_check.mjs http://127.0.0.1:8501
          # the page's craft: type, figures, measure, widows, touch, safe area, motion (John, 2026-11-09)
          node tools/craft_check.mjs http://127.0.0.1:8501
      # Every button glide lands (tools/glide_load_check.mjs): on the settled
      # page, through a trackpad flick, under a reader's swipe back and a
      # steady mouse wheel - and pressed while the page is still loading. Each
      # loading press gets its own cold app: a copy of this checkout with an
      # empty data/ cache, restarted, on its own port, so the app the other
      # steps use keeps its cache. (Clearing the cache from the page is not an
      # option: no visitor control may clear it - SECURITY-LESSONS.md.)
      - name: 8c. This commit - every button glide lands, settled and mid-load
        if: always()
        run: |
          node tools/glide_load_check.mjs http://127.0.0.1:8501 momentum 2
          node tools/glide_load_check.mjs http://127.0.0.1:8501 reader 2
          node tools/glide_load_check.mjs http://127.0.0.1:8501 steady 1
          node tools/glide_load_check.mjs http://127.0.0.1:8501 rest 2
          rm -rf /tmp/cold && cp -r . /tmp/cold
          status=0
          for b in 1 2 3 4 5; do
            rm -rf /tmp/cold/data /tmp/cold/logs
            (cd /tmp/cold && nohup streamlit run serve.py --server.port 8502 --server.headless true > /tmp/cold-$b.log 2>&1 &)
            for i in $(seq 1 60); do curl -sf http://127.0.0.1:8502/_stcore/health >/dev/null && break; sleep 2; done
            ONLY=$b node tools/glide_load_check.mjs http://127.0.0.1:8502 early 1 || status=1
            pkill -f "server.port 8502" || true; sleep 2
          done
          exit $status
      # John, 2026-11-04: "test simultaneous users and test backup restores".
      # Ten visitors open the page at the same moment on this commit's app,
      # through serve.py's rate limiter; then a copy of this checkout with no
      # data/ and no logs/ - what a redeploy or a restore from git leaves - is
      # started and timed to its first headline (the restore drill).
      - name: 8e. This commit - ten visitors at once while one address floods it, and a restore from nothing
        if: always()
        run: |
          # the flood (another address) runs WHILE the ten visitors load: it must be
          # hung up on at the cap, and none of them may notice (tools/flood_check.py)
          python -m tools.flood_check http://127.0.0.1:8501 > flood.log 2>&1 & flood=$!
          node tools/load_check.mjs http://127.0.0.1:8501 10 240 simultaneous
          wait $flood; cat flood.log
          rm -rf /tmp/restore && git worktree add -f /tmp/restore HEAD >/dev/null
          (cd /tmp/restore && nohup streamlit run serve.py --server.port 8504 --server.headless true > /tmp/restore.log 2>&1 &)
          start=$(date +%s)
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8504/_stcore/health >/dev/null && break; sleep 2; done
          echo "restore: healthy after $(( $(date +%s) - start ))s from an empty checkout"
          node tools/load_check.mjs http://127.0.0.1:8504 1 360 restore || { tail -40 /tmp/restore.log; exit 1; }
      - name: 9. Deployed site - recruiter walk (informational until this branch is deployed)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p walk/deployed
          node tools/recruiter_walk.mjs "$SITE_URL" walk/deployed
      # Every inch: boot, every button's flight, every word and chart, the
      # Gungnir maths, every preset, every crisis under both engines, the book,
      # every tab and drawer, every flyer, and the Risk Topology map run three
      # times under each calibration on both sides of the trade.
      - name: 10. This commit - deep scan, full depth, live data
        if: always()
        run: |
          mkdir -p scan/local
          export SCAN_PRESETS="$(python -c 'import json; from src.ingestion import PRESETS; print(json.dumps(list(PRESETS)))')"
          export SCAN_SCENARIOS="$(python -c 'import json; from src.scenarios import HISTORICAL_REGIMES as H; print(json.dumps(list(H)))')"
          DEPTH=full node tools/deep_scan.mjs http://127.0.0.1:8501 scan/local
      - name: 11. Deployed site - deep scan (informational until this branch is deployed)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p scan/deployed
          export SCAN_PRESETS="$(python -c 'import json; from src.ingestion import PRESETS; print(json.dumps(list(PRESETS)))')"
          export SCAN_SCENARIOS="$(python -c 'import json; from src.scenarios import HISTORICAL_REGIMES as H; print(json.dumps(list(H)))')"
          node tools/deep_scan.mjs "$SITE_URL" scan/deployed

      # Provenance runs first, so its verdicts sit thousands of lines above the
      # end of the log - past the 5,000-line tail the logs API returns (on
      # 2026-10-28 it went red on every branch and its FAIL lines could not be
      # read). Repeat them where the log ends.
      - name: 12. Provenance verdicts, repeated at the end of the log
        if: always()
        run: grep -E "^FAIL|provenance checks pass" provenance.log || echo "provenance did not run"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: live-audit
          path: |
            provenance.log
            audit/batch_audit_*
            site-shots/
            walk/
            scan/
            app.log
