# Dependencies are pinned to exact versions (requirements.txt, the workflows'
# actions, the image's base), so nothing updates by itself. Dependabot opens
# one PR a week per ecosystem; every PR runs the full Live, Pair and Options
# audits before anyone merges it. Security fixes still arrive the moment GitHub knows of them.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # The box runs the site's Python (runtime.txt, test_the_container_runs_what_
    # the_procfile_runs): only new builds of the same version (the digest), never
    # a version jump - move runtime.txt and the image together, on purpose.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
