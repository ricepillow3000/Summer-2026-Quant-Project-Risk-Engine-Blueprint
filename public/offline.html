<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline - Meliona</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #EDE9E3; color: #3F3B35;
               font-family: Georgia, 'Times New Roman', serif; }
  main { min-height: 100%; display: flex; flex-direction: column; justify-content: center;
         max-width: 560px; margin: 0 auto; padding: 0 24px; box-sizing: border-box; }
  h1 { font-weight: 400; font-size: 2.5rem; margin: 22px 0 12px; padding-top: 14px;
       border-top: 2px solid #9A7B4F; }
  p { font-size: 1.0625rem; line-height: 1.6; color: #4A4640; margin: 0 0 26px; }
  button { align-self: flex-start; background: #3F3B35; color: #EDE9E3; border: 0; border-radius: 0;
           font-family: Georgia, 'Times New Roman', serif; font-size: 1rem; padding: 16px 26px;
           cursor: pointer; transition: transform 120ms ease-out; }
  button:hover, button:focus-visible { background: #6A5030; outline: none; }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>Meliona works out every number from today's prices, so it needs a connection to show you anything new. This page reloads by itself the moment your connection is back.</p>
  <button type="button" onclick="location.reload()">Try again now</button>
</main>
<script>
  // back online: load the real page without a press
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
