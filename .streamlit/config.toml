[theme]
base = "light"
primaryColor = "#9A7B4F"             # bronze — drives slider, focus, accents
backgroundColor = "#D4CDBF"          # darker warm taupe page
secondaryBackgroundColor = "#E9E4DB" # cream — expanders, widgets, panels
textColor = "#4A4640"                # soft charcoal
font = "serif"

[server]
headless = true

# CORS and XSRF protection are Streamlit defaults (both true) and are left ON
# deliberately - they were previously switched off, which is harmless on
# localhost but a real weakness on a public URL. Do not disable them to fix an
# embedding or iframe problem without understanding what that opens up.
enableCORS = true
enableXsrfProtection = true

[client]
# Never render Python tracebacks to visitors: a stack trace leaks file paths,
# library versions and internal structure. Errors still appear in full in the
# server logs, where they belong.
showErrorDetails = false

# A visitor is a VIEWER, not an operator. Streamlit's default toolbar hands
# every anonymous visitor "Clear cache", "Rerun" and "Settings" - operator
# actions against shared server state on a single-process deploy. "viewer"
# removes that menu, which is the whole admin story here: this app has no
# accounts, no roles and no privileged data, so there is no admin to
# impersonate - only these operator buttons, and now they are gone.
#
# Honest limit: this hides the UI affordance. The underlying rerun/clear-cache
# messages still exist in Streamlit's protocol, so a determined visitor
# crafting websocket frames could still reach them. That is bounded to a
# denial-of-service, never a data leak, because the cache holds only public
# market data any visitor can already re-request - and it is bounded further
# by MAX_UNIVERSE and the cache budget in src/ingestion.py.
toolbarMode = "viewer"
